<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Gaming Video Editor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<style>
:root{--bg:#14110f;--panel:#1e1a17;--line:#3a322b;--text:#f1e9df;--mute:#a89b8c;--accent:#e8a33d;--ok:#6fbf73;--bad:#e5584f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "Trebuchet MS",Verdana,sans-serif;padding:16px;max-width:900px;margin:auto}
h1{font:700 28px/1.1 Impact,"Arial Narrow",sans-serif;letter-spacing:.5px;margin:8px 0 4px}
h2{font-size:17px;margin:0 0 10px;color:var(--accent)}
p.sub{color:var(--mute);margin:0 0 16px}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
label{display:block;font-size:14px;color:var(--mute);margin:8px 0 4px}
input,select,textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:10px;font:inherit}
button{background:var(--accent);color:#1a1209;border:0;border-radius:6px;padding:11px 16px;font:700 15px inherit;cursor:pointer;margin:8px 8px 0 0}
button.alt{background:transparent;color:var(--text);border:1px solid var(--line)}
button:disabled{opacity:.5}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
video{width:100%;border-radius:6px;background:#000;max-height:50vh}
#ov{position:absolute;left:0;right:0;bottom:12%;text-align:center;font:700 clamp(20px,5vw,38px) Impact,sans-serif;color:#fff;text-shadow:0 2px 6px #000;pointer-events:none}
.stage{position:relative}
#lotc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none}
#ovl{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:screen;pointer-events:none;display:none}
#cap{position:absolute;left:4%;right:4%;bottom:3%;text-align:center;font:700 clamp(14px,3.4vw,24px) sans-serif;color:#fff;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:4px;pointer-events:none}
#cap:empty{display:none}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes slide{from{transform:translateX(-80%);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes glitch{0%{transform:translate(0)}20%{transform:translate(-4px,2px);text-shadow:3px 0 #f0f,-3px 0 #0ff}40%{transform:translate(4px,-2px)}60%{transform:translate(-2px,0);text-shadow:-3px 0 #f0f,3px 0 #0ff}100%{transform:none}}
@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.a-pop{animation:pop .5s both}.a-slide{animation:slide .5s both}.a-shake{animation:shake .5s both}.a-fade{animation:fade .6s both}.a-glitch{animation:glitch .5s both}.a-typewriter{animation:type 1s steps(20) both}
#status{color:var(--mute);min-height:22px;margin-top:8px}
#status.err{color:var(--bad)}
.item{border-bottom:1px solid var(--line);padding:7px 0;font-size:15px}
.item b{color:var(--accent)}
a{color:var(--accent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
body{display:flex;flex-direction:column;min-height:100dvh;padding:10px 12px 0}
header{display:flex;align-items:center;justify-content:space-between}
.ic{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:50%;width:44px;height:44px;padding:0;margin:0;font-size:20px;flex:none}
#settings{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}
#player{max-height:34vh}
#chat{flex:1;overflow-y:auto;padding:6px 0}
.m{max-width:90%;padding:10px 12px;border-radius:14px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.m.u{margin-left:auto;background:var(--accent);color:#1a1209}
.m.a{background:var(--panel);border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips button{margin:0}
#bar{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
#bar input{flex:1;border-radius:22px}#bar button#send{margin:0}
#mic.on{background:var(--bad);color:#fff}
[hidden]{display:none!important}

:root{--bg:#0b0d1a;--panel:#151933;--line:#2b3160;--text:#f1f3ff;--mute:#a7b0da;--accent:#8ab4ff;--g:linear-gradient(135deg,#3b6fe0 0%,#8a5bd0 50%,#c2456b 100%)}
body{background:radial-gradient(900px 500px at 10% -10%,#27307a66,transparent),radial-gradient(800px 500px at 100% 0%,#7a2a8a55,transparent),var(--bg);background-attachment:fixed}
h1{font:800 26px/1.1 "Trebuchet MS",Verdana,sans-serif;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:0}
h2{color:#c4b5fd}
button{background:var(--g);color:#fff;box-shadow:0 4px 14px #8b5cf655}
button.alt{background:#ffffff0d;color:var(--text);border:1px solid var(--line);box-shadow:none}
.ic{background:#ffffff12;border:1px solid var(--line);box-shadow:none;color:var(--text)}
#settings,.m.a{background:#ffffff0a;backdrop-filter:blur(10px);border:1px solid var(--line)}
.m.u{background:var(--g);color:#fff}
input,select,textarea{background:#0b0d1acc}
input:focus,select:focus,textarea:focus{border-color:#8b5cf6}
#bar{background:linear-gradient(transparent,var(--bg) 30%)}
#bar input{background:#151933;border:1px solid #3b4290}
.chips button{background:#ffffff0d;border:1px solid #4b54a8;color:#dfe3ff}
.item b{color:#f9a8d4}
a{color:#93c5fd}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.grid img{width:100%;border-radius:8px;aspect-ratio:1;object-fit:cover}
#stk{position:absolute;display:none;pointer-events:none;max-width:60%}
</style>
</head>
<body>
<body>
<header><h1>✨ AI Video Studio</h1><button class="ic" id="gear" aria-label="API सेटिंग्स">⚙</button></header>
<div id="settings" hidden>
<h2>API सेटिंग्स</h2>
<div class="row"><div><label for="prov">AI</label><select id="prov"><option value="claude">Claude</option><option value="openai">ChatGPT (OpenAI)</option><option value="gemini">Gemini (Google)</option></select></div>
<div><label for="key">API key</label><input id="key" type="password" autocomplete="off"></div></div>
<input id="model" type="hidden">
<label for="asr">वीडियो की आवाज़ कैसे सुनें</label>
<select id="asr"><option value="whisper">Whisper (OpenAI key चाहिए)</option><option value="gemini">Gemini (Gemini key चाहिए)</option><option value="off">सिर्फ़ तेज़ आवाज़ के पल (बिना key)</option></select>
<label for="tkey">आवाज़ सुनने की key (वही AI हो तो खाली छोड़ें)</label><input id="tkey" type="password" autocomplete="off">
<label for="fskey">Freesound key (साउंड और म्यूज़िक ढूँढने के लिए, मुफ़्त)</label><input id="fskey" type="password" autocomplete="off">
<label for="pxkey">Pixabay key (इफेक्ट वीडियो के लिए, मुफ़्त)</label><input id="pxkey" type="password" autocomplete="off">
<label for="pxlkey">Pexels key (फ़ुटेज और फ़ोटो के लिए, मुफ़्त)</label><input id="pxlkey" type="password" autocomplete="off">
<p class="sub" style="margin:6px 0 0">मुफ़्त key: <a href="https://freesound.org/apiv2/apply" target="_blank" rel="noopener">Freesound</a>, <a href="https://pixabay.com/api/docs/" target="_blank" rel="noopener">Pixabay</a>, <a href="https://www.pexels.com/api/" target="_blank" rel="noopener">Pexels</a></p>
<label for="clang">कैप्शन की भाषा</label>
<select id="clang"><option>हिंदी</option><option>English</option><option>Hinglish (रोमन हिंदी)</option></select>
<button class="alt" id="spk">आवाज़ में जवाब: चालू</button>
<details><summary>एडवांस्ड</summary>
<label for="lurl">Lottie .json के लिंक (हर लाइन में एक)</label><textarea id="lurl" rows="2"></textarea>
<button class="alt" id="laddurl">लिंक से जोड़ें</button>
<input id="vid" type="file" hidden><input id="mus" type="file" hidden multiple><input id="sfx" type="file" hidden multiple><input id="lot" type="file" hidden multiple>
<section id="planbox" hidden>
<h2>एडिट प्लान</h2><div id="plan"></div>
<button id="prev">प्रीव्यू</button><button class="alt" id="exp">एक्सपोर्ट</button><button class="alt" id="dl">प्लान JSON डाउनलोड</button>
<label for="edit">प्लान JSON (बदलकर अपडेट दबाएँ)</label><textarea id="edit" rows="8"></textarea>
<button class="alt" id="upd">अपडेट</button>
</section>
</details>
<button id="go" hidden></button><textarea id="style" hidden></textarea>
</div>
<div class="stage"><video id="player" controls playsinline></video><video id="ovl" muted playsinline></video><canvas id="lotc" width="1280" height="720"></canvas><img id="stk" alt=""><div id="ov"></div><div id="cap"></div></div>
<div id="status"></div>
<div id="chat" aria-live="polite"></div>
<div id="bar"><button class="ic" id="att" aria-label="फ़ाइल जोड़ें">＋</button><input id="msg" placeholder="AI से बात करें या एडिट बताएँ..." autocomplete="off"><button class="ic" id="mic" aria-label="माइक">🎤</button><button id="send">भेजें</button></div>
<input id="all" type="file" accept="video/*,audio/*,image/*,.json" multiple hidden>
<canvas id="cv" hidden></canvas>
<script>
const $=id=>document.getElementById(id);
const DEF={claude:"claude-sonnet-5-5",openai:"gpt-4o",gemini:"gemini-3.7-flash"};
let plan=null, musicUrls=[], sfxNames=[];

function load(){try{const s=JSON.parse(localStorage.getItem("aiedit")||"{}");if(s.prov)$("prov").value=s.prov;$("model").value=DEF[$("prov").value];["key","asr","tkey","fskey","pxkey","clang"].forEach(i=>{if(s[i]!=null)$(i).value=s[i]})}catch(e){$("model").value=DEF.claude}}
function save(){try{localStorage.setItem("aiedit",JSON.stringify(Object.fromEntries(["prov","key","asr","tkey","fskey","pxkey","clang"].map(i=>[i,$(i).value]))))}catch(e){}}
$("prov").onchange=()=>{$("model").value=DEF[$("prov").value];save()};
$("model").oninput=save;$("key").oninput=save;
load();

function status(t,err){if(err&&/no credits|insufficient_quota|billing/i.test(t))t="इस AI अकाउंट में क्रेडिट नहीं हैं। ⚙ में AI और आवाज़ सुनने का तरीका, दोनों Gemini चुनें।";if(err&&/high demand|overload/i.test(t))t="Gemini पर अभी बहुत भीड़ है। 1-2 मिनट बाद फिर कोशिश करें।";$("status").textContent=t;$("status").className=err?"err":"";if(err&&typeof say==="function")say("⚠️ "+t,"a",null,true)}

$("vid").onchange=e=>{const f=e.target.files[0];if(f)$("player").src=URL.createObjectURL(f)};
$("mus").onchange=e=>{musicUrls=[...e.target.files].map(f=>({name:f.name,url:URL.createObjectURL(f)}))};
$("sfx").onchange=e=>{sfxNames=[...e.target.files].map(f=>f.name)};

function seek(v,t){return new Promise(r=>{v.onseeked=()=>r();v.currentTime=t})}

async function grabFrames(n){
  const v=$("player"),c=$("cv"),x=c.getContext("2d");
  if(!v.duration||!isFinite(v.duration))throw new Error("पहले वीडियो अपलोड करें।");
  const w=512,h=Math.round(w*v.videoHeight/v.videoWidth);c.width=w;c.height=h;
  const out=[];
  for(let i=0;i<n;i++){
    const t=v.duration*(i+.5)/n;
    await seek(v,t);x.drawImage(v,0,0,w,h);
    out.push({t:Math.round(t*10)/10,b64:c.toDataURL("image/jpeg",.6).split(",")[1]});
    status("फ्रेम निकाल रहा हूँ: "+(i+1)+"/"+n);
  }
  v.currentTime=0;return out;
}

function buildPrompt(frames,dur,loudS,tx){
  return "तुम एक प्रोफेशनल गेमिंग वीडियो एडिटर हो (GTA, Palworld जैसे सिनेमैटिक कंटेंट)। नीचे वीडियो के "+frames.length+" फ्रेम हैं, इनके समय (सेकंड) हैं: "+frames.map(f=>f.t).join(", ")+". वीडियो की कुल लंबाई "+dur.toFixed(1)+" सेकंड है.\n"
  +"यूज़र का स्टाइल: "+($("style").value||"सिनेमैटिक")+"\n"
  +"यूज़र के म्यूज़िक: "+(musicUrls.map(m=>m.name).join(", ")||"कोई नहीं")+"\nयूज़र के साउंड इफेक्ट्स: "+(sfxNames.join(", ")||"कोई नहीं")+"\n"
  +"वीडियो की आवाज़: तेज़ आवाज़ वाले सेकंड (धमाका, गोलीबारी या चिल्लाना हो सकता है): "+(loudS.length?loudS.join(", "):"कोई खास नहीं")+".\nबोले गए शब्द:\n"+(tx||"(ट्रांसक्रिप्शन बंद है)")+"\nएडिट का प्लान आवाज़ और फ्रेम दोनों देखकर बनाओ: बातचीत के बीच कट मत काटो, तेज़ आवाज़ वाले पलों पर इफेक्ट और ज़ूम रखो।\n"
  +"सिर्फ़ JSON दो, कोई और टेक्स्ट नहीं, इस फ़ॉर्मेट में:\n"
  +'{"summary":"वीडियो में क्या हो रहा है","cuts":[{"start":0,"end":10,"note":"क्यों रखा"}],"texts":[{"time":2,"duration":3,"text":"कैप्शन","animation":"pop/slide/shake/fade"}],"transitions":[{"time":10,"type":"whip/zoom/glitch/fade"}],"music":[{"time":0,"file":"अपलोड की फ़ाइल का नाम या mood","note":""}],"sfx":[{"time":5,"file":"फ़ाइल का नाम या ज़रूरी इफेक्ट","note":""}]}\n'
  +"JSON में ये अतिरिक्त फ़ील्ड भी दो: \"grade\" (कलर ग्रेडिंग, इनमें से एक: none, cinematic, gta, moody, vivid, noir), \"font\" (इनमें से एक: Bebas Neue, Anton, Bangers, Oswald, Permanent Marker, Rubik Glitch, Black Ops One, Teko), और \"captions\":[{\"start\":0,\"end\":2,\"text\":\"...\"}] (बोले गए शब्दों से छोटे सबटाइटल, हर लाइन ज़्यादा से ज़्यादा 6 शब्द, भाषा: "+$("clang").value+"). texts की animation इनमें से एक हो: pop, slide, shake, fade, glitch, typewriter. sfx और music की हर एंट्री में \"query\" भी दो (English में 1 से 3 शब्द का सर्च, जैसे gunshot, whoosh, cinematic boom, dark ambient) ताकि इंटरनेट से मिल सके।\n"
  +"texts की animation अब Animate.css की कोई भी एनिमेशन हो सकती है (जैसे bounceIn, zoomIn, flipInX, backInDown, rubberBand, jackInTheBox, lightSpeedInRight, tada, heartBeat, rollIn, shakeX, wobble) या glitch, typewriter। इसके अलावा \"overlays\":[{\"time\":5,\"duration\":3,\"query\":\"fire sparks\"}] भी दो: ये इंटरनेट से मिलने वाली इफेक्ट वीडियो हैं जो स्क्रीन पर ऊपर से लगती हैं (आग, चिंगारी, धुआँ, लाइट लीक, बारिश; query English में, काले बैकग्राउंड वाली चीज़ें खोजो)।\n"
  +"यूज़र की Lottie एनिमेशन (स्टिकर/इफेक्ट): "+(lotties.map(l=>l.name).join(", ")||"कोई नहीं")+". अगर हैं तो \"lotties\":[{\"time\":4,\"duration\":3,\"file\":\"नाम\"}] भी दो, सही पलों पर (धमाका, जीत, लेवल-अप)।\n"
  +"यूट्यूब के लिए भी दो: \"youtube\":{\"title\":\"क्लिक-योग्य टाइटल\",\"description\":\"SEO डिस्क्रिप्शन हैशटैग के साथ\",\"tags\":[\"टैग1\",\"टैग2\"]} (वीडियो की कहानी के हिसाब से)।\n"
  +"PNG/स्टिकर इमेज के लिए \"stickers\":[{\"time\":3,\"duration\":2,\"file\":\"अपलोड की इमेज का नाम (अगर है)\",\"query\":\"english keyword जैसे trophy, crown, fire\",\"x\":0.66,\"y\":0.08,\"size\":0.28}] भी दो (x, y, size स्क्रीन के अनुपात में, 0 से 1)। यूज़र की इमेज: "+(stickerFiles.map(f=>f.name).join(", ")||"कोई नहीं")+"\n"
  +"cuts में सिर्फ़ वो हिस्से रखो जो रखने लायक हैं (बोरिंग हिस्से हटाओ)। टेक्स्ट यूज़र की भाषा/स्टाइल में लिखो।";
}

async function callAI(frames,prompt){
  const prov=$("prov").value,key=$("key").value.trim(),model=$("model").value.trim();
  if(!key)throw new Error("API key डालें।");
  let r,j;
  if(prov==="claude"){
    r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model,max_tokens:4000,messages:[{role:"user",content:[...frames.map(f=>({type:"image",source:{type:"base64",media_type:"image/jpeg",data:f.b64}})),{type:"text",text:prompt}]}]})});
    j=await r.json();if(!r.ok)throw new Error(j.error?.message||"Claude error");return j.content.map(c=>c.text||"").join("");
  }
  if(prov==="openai"){
    r=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+key},
      body:JSON.stringify({model,messages:[{role:"user",content:[{type:"text",text:prompt},...frames.map(f=>({type:"image_url",image_url:{url:"data:image/jpeg;base64,"+f.b64}}))]}]})});
    j=await r.json();if(!r.ok)throw new Error(j.error?.message||"OpenAI error");return j.choices[0].message.content;
  }
  r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+model+":generateContent?key="+encodeURIComponent(key),{method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify({contents:[{parts:[{text:prompt},...frames.map(f=>({inline_data:{mime_type:"image/jpeg",data:f.b64}}))]}]})});
  j=await r.json();if(!r.ok)throw new Error(j.error?.message||"Gemini error");return j.candidates[0].content.parts.map(p=>p.text||"").join("");
}

async function getAudio(){
  const f=window.vfile||$("vid").files[0];if(!f)throw new Error("पहले वीडियो अपलोड करें।");
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  let buf;
  try{buf=await ctx.decodeAudioData(await f.arrayBuffer())}
  catch(e){throw new Error("वीडियो की आवाज़ पढ़ नहीं पाया। फ़ाइल बहुत बड़ी हो सकती है, छोटा हिस्सा या MP4 में आज़माएँ।")}
  const n=buf.length,out=new Float32Array(n),ch=buf.numberOfChannels;

const MODELS={claude:["claude-sonnet-5-5","claude-sonnet-4-5","claude-haiku-4-5"],openai:["gpt-4o","gpt-4o-mini"],gemini:["gemini-3.7-flash","gemini-3.6-flash","gemini-3.5-flash","gemini-2.5-flash"]};
const _fetch=window.fetch.bind(window),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const RETRY=/high demand|overload|unavailable|exhausted|quota|rate|try again|not found|not supported|no longer|deprecat/i;
window.fetch=async function(u,o){
  const g=typeof u==="string"&&u.match(/(generativelanguage\.googleapis\.com\/v1beta\/models\/)([^:]+)(:.*)/);
  if(!g)return _fetch(u,o);
  const ms=[...new Set([g[2],...MODELS.gemini])];let r;
  for(let round=0;round<2;round++)for(const m of ms){
    r=await _fetch(u.replace(g[0],g[1]+m+g[3]),o);
    if(r.ok)return r;
    let msg="";try{msg=(await r.clone().json()).error?.message||""}catch(e){}
    if(!(RETRY.test(msg)||[429,503,404].includes(r.status)))return r;
    status("Gemini पर भीड़ है, दूसरा मॉडल आज़मा रहा हूँ...");await sleep(1500);
  }
  return r;
};
const callOne=callAI;const okModel={};
callAI=async function(frames,prompt){
  const p=$("prov").value,ms=p==="gemini"?[MODELS.gemini[0]]:[...new Set([okModel[p],...MODELS[p]].filter(Boolean))];let last;
  for(const m of ms){$("model").value=m;
    try{const r=await callOne(frames,prompt);okModel[p]=m;return r}
    catch(e){last=e;if(!/not found|not supported|no longer|does not exist|404|deprecat|unavailable|high demand|overload|529|503|429|exhausted/i.test(e.message))throw e}}
  throw last;
};
const chat=$("chat");let speak=true,busy=false,hist=[],lastTx="";
function say(t,who,chips,quiet){
  const d=document.createElement("div");d.className="m "+(who||"a");d.textContent=t;
  if(chips){const w=document.createElement("div");w.className="chips";chips.forEach(([l,f])=>{const b=document.createElement("button");b.className="alt";b.textContent=l;b.onclick=f;w.appendChild(b)});d.appendChild(w)}
  chat.appendChild(d);d.scrollIntoView({block:"end"});
  if(who!=="u"&&!quiet&&speak&&window.speechSynthesis&&t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.slice(0,300));u.lang=/[\u0900-\u097F]/.test(t)?"hi-IN":"en-IN";speechSynthesis.speak(u)}
  return d;
}
function onPlan(){
  const n=k=>(plan[k]||[]).length,y=plan.youtube||{};
  say("प्लान तैयार: "+(plan.summary||"")+"\n\n✂ कट "+n("cuts")+" | 🔤 टेक्स्ट "+n("texts")+" | 💬 कैप्शन "+n("captions")+" | 🔊 साउंड "+n("sfx")+" | ✨ ओवरले "+n("overlays")+" | कलर: "+(plan.grade||"-"),"a",[["▶ प्रीव्यू",()=>play(false)],["⬇ वीडियो एक्सपोर्ट",()=>play(true)]]);
  if(y.title){const all=y.title+"\n\n"+(y.description||"")+"\n\n"+(y.tags||[]).join(", ");say("📌 टाइटल: "+y.title+"\n\n📝 डिस्क्रिप्शन:\n"+(y.description||"")+"\n\n🏷 टैग: "+(y.tags||[]).join(", "),"a",[["कॉपी करें",()=>navigator.clipboard.writeText(all)]],true)}
}
async function addFile(f){
  const n=f.name,t=f.type||"";
  if(t.startsWith("video")||/\.(mp4|mov|webm|mkv)$/i.test(n)){window.vfile=f;$("player").src=URL.createObjectURL(f);say("वीडियो जुड़ गया: "+n,"a",null,true)}
  else if(t.startsWith("audio")||/\.(mp3|wav|ogg|m4a)$/i.test(n)){const u=URL.createObjectURL(f);musicUrls.push({name:n,url:u});sfxFiles.push({name:n,url:u});sfxNames.push(n);say("ऑडियो जुड़ गया: "+n,"a",null,true)}
  else if(t.startsWith("image")||/\.(png|webp|jpe?g|gif)$/i.test(n)){stickerFiles.push({name:n,url:URL.createObjectURL(f)});say("इमेज/PNG जुड़ गई: "+n,"a",null,true)}
  else if(/\.json$/i.test(n)){try{lotties.push({name:n,data:JSON.parse(await f.text())});say("Lottie एनिमेशन जुड़ गया: "+n,"a",null,true)}catch(x){say("ये सही Lottie JSON नहीं है।")}}
}
async function importUrl(u){
  try{const r=await fetch(u);if(!r.ok)throw 0;const b=await r.blob();await addFile(new File([b],u.split("?")[0].split("/").pop()||"file",{type:b.type}));}
  catch(e){say("ये लिंक सीधे नहीं खुला। साइट डाउनलोड रोक रही है; फ़ाइल खुद डाउनलोड करके ＋ से जोड़ें।")}
}
async function find(f){
  const k=f.kind||"sfx",q=f.query;status("'"+q+"' ढूँढ रहा हूँ...");
  if(k==="png"||k==="image"){const L=[...await pxImg(q,6),...await pexImg(q)];status("");if(!L.length){say("'"+q+"' की इमेज नहीं मिली। ⚙ में Pixabay या Pexels की key डालें।");return}showImgs(q,L);return}
  if(k==="footage"){const fu=await pexVid(q);status("");if(!fu){say("'"+q+"' का फ़ुटेज नहीं मिला। ⚙ में Pexels की key डालें।");return}say("फ़ुटेज मिल गया: "+q,"a",[["⬇ खोलें / डाउनलोड",()=>window.open(fu,"_blank")]],true);return}
  const u=k==="video"?await pxFind(q):await fsFind(q,k==="music");status("");
  if(!u){say("'"+q+"' नहीं मिला। ⚙ में Freesound/Pixabay की key डालें, या freesound.org, pixabay.com, mixkit.co, YouTube Audio Library से खुद डाउनलोड करके ＋ से जोड़ें।");return}
  if(k!=="video"){const nm=q+(k==="music"?" music":" sfx");musicUrls.push({name:nm,url:u});sfxFiles.push({name:nm,url:u});sfxNames.push(nm)}
  say("मिल गया"+(k!=="video"?" और एडिट में जोड़ दिया":"")+": "+q,"a",[["⬇ खोलें / डाउनलोड",()=>window.open(u,"_blank")]],true);
}
async function brain(text){
  const ctx={video:!!$("player").src,duration:$("player").duration||0,music:musicUrls.map(m=>m.name),sfx:sfxFiles.map(m=>m.name),lottie:lotties.map(l=>l.name),plan};
  const sys="तुम एक दोस्ताना एक्सपर्ट गेमिंग वीडियो एडिटिंग AI असिस्टेंट हो (यूज़र GTA, Palworld जैसे सिनेमैटिक वीडियो बनाता है)। यूज़र की भाषा (हिंदी/हिंग्लिश) में छोटा जवाब दो।\nऐप की स्थिति: "+JSON.stringify(ctx).slice(0,6000)+"\nवीडियो में बोले गए शब्द: "+lastTx.slice(0,2500)+"\nपिछली बातचीत:\n"+hist.slice(-6).map(h=>h.r+": "+h.t).join("\n")+"\nयूज़र: "+text
   +"\n\nसिर्फ़ JSON दो: {\"reply\":\"जवाब\",\"action\":\"none|analyze|preview|export|find|update\",\"find\":{\"kind\":\"sfx|music|video|png|footage\",\"query\":\"english keywords\"},\"plan\":{पूरा बदला हुआ प्लान, सिर्फ़ action=update पर}}। नियम: वीडियो एडिट कराना या नया प्लान बनाना हो तो analyze; प्लान में बदलाव माँगे तो update और पूरा नया plan दो; प्रीव्यू या एक्सपोर्ट माँगे तो वही action; कोई साउंड, म्यूज़िक, इफेक्ट वीडियो, PNG/इमेज (kind png) या फ़ुटेज (kind footage) चाहिए तो find; टाइटल, डिस्क्रिप्शन या टैग माँगे तो reply में दो; आम सवाल पर action none। कॉपीराइट वाला कंटेंट (गाने, मूवी क्लिप) डाउनलोड नहीं करवा सकते: ऐसा माँगे तो विनम्रता से मना करो और रॉयल्टी-फ्री विकल्प सुझाओ (Freesound CC0, Pixabay, YouTube Audio Library)।";
  const t=await callAI([],sys);
  try{return parsePlan(t)}catch(e){return{reply:t,action:"none"}}
}
async function send(){
  const text=$("msg").value.trim();if(!text||busy)return;
  $("msg").value="";say(text,"u");hist.push({r:"यूज़र",t:text});busy=true;
  try{
    for(const u of text.match(/https?:\/\/\S+\.(?:mp3|wav|ogg|m4a|mp4|webm|mov|json)(?:\?\S*)?/gi)||[])await importUrl(u);
    status("AI सोच रहा है...");
    const o=await brain(text);status("");
    hist.push({r:"AI",t:o.reply||""});
    if(o.reply)say(o.reply,"a");
    if(o.action==="analyze"){if(!$("player").src)say("पहले ＋ से अपना वीडियो जोड़ें।");else{$("style").value=text;$("go").click()}}
    else if(o.action==="update"&&o.plan){plan=o.plan;show();say("प्लान अपडेट हो गया।","a",[["▶ प्रीव्यू",()=>play(false)],["⬇ एक्सपोर्ट",()=>play(true)]],true)}
    else if(o.action==="preview"||o.action==="export"){if(plan)play(o.action==="export");else say("पहले एडिट प्लान बनवाएँ।")}
    else if(o.action==="find"&&o.find)await find(o.find);
  }catch(e){status(e.message,true)}
  busy=false;
}
$("gear").onclick=()=>{$("settings").hidden=!$("settings").hidden};
$("spk").onclick=()=>{speak=!speak;if(!speak)speechSynthesis.cancel();$("spk").textContent="आवाज़ में जवाब: "+(speak?"चालू":"बंद")};
$("send").onclick=send;$("msg").onkeydown=e=>{if(e.key==="Enter")send()};
$("att").onclick=()=>$("all").click();
$("all").onchange=async e=>{for(const f of e.target.files)await addFile(f);e.target.value=""};
$("mic").onclick=()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){say("इस ब्राउज़र में माइक काम नहीं करता, Chrome इस्तेमाल करें।","a",null,true);return}
  speechSynthesis.cancel();const r=new SR();r.lang="hi-IN";r.interimResults=false;$("mic").classList.add("on");
  r.onresult=e=>{$("msg").value=e.results[0][0].transcript;send()};
  r.onend=r.onerror=()=>$("mic").classList.remove("on");r.start();
};

say("नमस्ते! ＋ से अपना गेमप्ले वीडियो जोड़ें, फिर बोलकर या लिखकर बताइए, जैसे \"इसे सिनेमैटिक एडिट करो\"। पहली बार ऊपर ⚙ में अपनी API key डालें।","a",[["🎬 गेमिंग इंट्रो एडिट करो",()=>quick("इस वीडियो को बेस्ट गेमिंग इंट्रो की तरह एडिट करो: कैप्शन, टाइटल एनिमेशन, साउंड इफेक्ट, म्यूज़िक और कलर ग्रेडिंग के साथ")],["🔊 साउंड इफेक्ट ढूँढो",()=>quick("एक दमदार whoosh साउंड इफेक्ट ढूँढो")],["🖼 PNG ढूँढो",()=>quick("गेमिंग के PNG स्टिकर ढूँढो")],["🎞 फ़ुटेज ढूँढो",()=>quick("cinematic city night का फ़ुटेज ढूँढो")]],true);
let stickerFiles=[];
const quick=t=>{$("msg").value=t;send()};
async function pxImg(q,n){
  const k=$("pxkey").value.trim();if(!k||!q)return[];
  try{const r=await fetch("https://pixabay.com/api/?key="+encodeURIComponent(k)+"&q="+encodeURIComponent(q)+"&image_type=illustration&safesearch=true&per_page="+Math.max(3,n||4));
    const j=await r.json();return(j.hits||[]).slice(0,n||4).map(h=>({thumb:h.previewURL,full:h.largeImageURL||h.webformatURL}))}catch(e){return[]}
}
async function pexImg(q){
  const k=$("pxlkey").value.trim();if(!k)return[];
  try{const r=await fetch("https://api.pexels.com/v1/search?per_page=3&query="+encodeURIComponent(q),{headers:{Authorization:k}});
    const j=await r.json();return(j.photos||[]).map(x=>({thumb:x.src.small,full:x.src.large2x||x.src.original}))}catch(e){return[]}
}
async function pexVid(q){
  const k=$("pxlkey").value.trim();if(!k)return null;
  try{const r=await fetch("https://api.pexels.com/videos/search?per_page=1&query="+encodeURIComponent(q),{headers:{Authorization:k}});
    const j=await r.json(),v=j.videos&&j.videos[0],f=v&&(v.video_files.find(x=>x.quality==="hd")||v.video_files[0]);return f&&f.link}catch(e){return null}
}
function showImgs(q,L){
  const d=document.createElement("div");d.className="m a";d.textContent="'"+q+"' की इमेज (टैप करके खोलें और सेव करें):";
  const g=document.createElement("div");g.className="grid";
  L.forEach(i=>{const a=document.createElement("a");a.href=i.full;a.target="_blank";a.rel="noopener";const m=document.createElement("img");m.src=i.thumb;m.alt=q;a.appendChild(m);g.appendChild(a)});
  d.appendChild(g);chat.appendChild(d);d.scrollIntoView({block:"end"});
}
